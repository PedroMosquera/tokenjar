name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # swift-tools-version 6.2 and the 26.0 SDK stamp in the Makefile need Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make app
