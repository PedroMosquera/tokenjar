name: CI

on:
  push:
    # wip/ branches run CI without a PR, for platforms there is no local machine to test on.
    branches: [main, "wip/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # swift-tools-version 6.2 and the 26.0 SDK stamp in the Makefile need Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make app

  linux-core:
    # Only TokenjarCore and its tests build on Linux; the app is AppKit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain image
        run: |
          docker build -t tokenjar-linux - <<'EOF'
          FROM swift:6.2.4-noble
          RUN apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev && rm -rf /var/lib/apt/lists/*
          EOF

      # Not as root: root reads files a test made unreadable, so those tests would fail.
      - name: Test
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src tokenjar-linux swift test

  windows-core:
    # The core, its tests, the tray and the console tokenjar. The Mac app is AppKit and does not build here.
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      # Fixtures are compared byte for byte, so they must keep their LF line endings.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.2.4"

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      # Also after a failed test run, so one round reports both. Packaging still needs everything to pass.
      - name: Build the tray and tokenjar
        if: ${{ !cancelled() }}
        run: swift build -c release

      # A folder that runs on a PC with no Swift installed: both programs, the Swift runtime beside them, and the Visual
      # C++ runtime, which Microsoft allows apps to carry.
      - name: Package
        shell: pwsh
        run: |
          $bin = swift build -c release --show-bin-path
          $runtime = Split-Path (where.exe swiftCore.dll | Select-Object -First 1)
          New-Item -ItemType Directory -Force tokenjar-windows | Out-Null
          Copy-Item "$bin\TokenjarTray.exe", "$bin\tokenjar.exe" tokenjar-windows
          Copy-Item "$runtime\*.dll" tokenjar-windows
          Copy-Item "$env:SystemRoot\System32\vcruntime140.dll", "$env:SystemRoot\System32\vcruntime140_1.dll", "$env:SystemRoot\System32\msvcp140.dll" tokenjar-windows
          # With only Windows on the PATH, the DLLs can come from nowhere but the folder.
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          ./tokenjar-windows/tokenjar.exe --status
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: tokenjar-windows
          path: tokenjar-windows
          retention-days: 14
